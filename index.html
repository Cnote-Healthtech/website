<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNOTE Healthtech</title>
<meta name="description" content="CNOTE Healthtech: clinical natural language processing. Extracting clinical entities from free-text health records and mapping them to SNOMED CT, ICD-10 and OPCS-4.">
<style>
:root { --ink: #14212b; --muted: #5b6b77; --accent: #0b6e72; --bg: #f7f8f6; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; line-height: 1.6; }
main { flex: 1; display: flex; align-items: center; padding: 3rem 1.5rem; }
.wrap { max-width: 42rem; margin: 0 auto; width: 100%; }
.mark { width: 2.5rem; height: 0.35rem; background: var(--accent); margin-bottom: 2rem; }
h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.tag { font-size: 1.25rem; color: var(--accent); margin-top: 0.5rem; }
p.lede { font-size: 1.125rem; margin-top: 2rem; max-width: 36rem; }
.contact { margin-top: 2rem; }
.contact a { color: var(--ink); font-weight: 600; text-decoration-color: var(--accent); text-underline-offset: 0.2em; }
footer { padding: 1.5rem; font-size: 0.8125rem; color: var(--muted); border-top: 1px solid #e2e6e3; }
footer .wrap { max-width: 42rem; }
</style>
</head>
<body>
<main>
<div class="wrap">
<div class="mark"></div>
<h1>CNOTE Healthtech</h1>
<p class="tag">Clinical natural language processing</p>
<p class="lede">We extract clinical entities from free-text health records and map them to SNOMED CT, ICD-10 and OPCS-4.</p>
<p class="contact">Contact: <a href="mailto:enquiries@cnote.co.uk">enquiries@cnote.co.uk</a></p>
</div>
</main>
<footer>
<div class="wrap">CNOTE Healthtech Ltd &middot; Registered in England and Wales, company no. 17228849</div>
</footer>
</body>
</html>
